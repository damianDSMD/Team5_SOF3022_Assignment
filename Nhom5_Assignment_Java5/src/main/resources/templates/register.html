<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    /* Container styling */
    .register-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      animation: fadeIn 1s ease;
    }

    .register-box {
      width: 420px;
      padding: 40px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(15px);
      text-align: center;
      animation: fadeIn 1s ease;
    }

    .register-box h2 {
      font-size: 2rem;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #fff, #999);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Inputs */
    .register-box input {
      width: 100%;
      padding: 12px 18px;
      margin: 10px 0;
      border: none;
      border-radius: 25px;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      transition: 0.3s;
    }

    .register-box input:focus {
      background: rgba(255,255,255,0.2);
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    /* Red border for error */
    .input-error {
      border: 2px solid #ff4d4d;
      background: rgba(255,0,0,0.1);
    }

    .error-text {
      color: #ff6b6b;
      font-size: 0.9rem;
      text-align: left;
      margin-top: -5px;
      margin-bottom: 10px;
      padding-left: 10px;
    }

    /* Button */
    .register-box button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border-radius: 25px;
      border: 2px solid #fff;
      background: transparent;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.4s;
    }

    .register-box button:hover {
      background: #fff;
      color: #000;
      transform: scale(1.05);
    }

    .register-links {
      margin-top: 15px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .register-links a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .register-links a:hover {
      text-decoration: underline;
    }

    /* Success notification popup */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #00c46a;
      color: #fff;
      padding: 15px 25px;
      border-radius: 10px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.5s ease;
      z-index: 100;
    }

    .notification.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<!-- ✅ Success popup -->
<div class="notification" id="successPopup" th:if="${success}">
  <span>🎉 Tạo tài khoản thành công!</span>
</div>

<div class="register-wrapper">
  <div class="register-box">
    <h2>Tạo tài khoản</h2>

    <!-- Global messages -->
    <p th:if="${error}" th:text="${error}" style="color:#ff6b6b; font-weight:bold;"></p>
    <p th:if="${message}" th:text="${message}" style="color:#00ff88; font-weight:bold;"></p>

    <form th:action="@{/register}" th:object="${khachHang}" method="post" id="registerForm" onsubmit="return validateForm()">
      <input type="text" th:field="*{tenKH}" id="tenKH" placeholder="Họ và tên" required>
      <div class="error-text" id="err-tenKH"></div>

      <input type="text" th:field="*{sdt}" id="sdt" placeholder="Số điện thoại" required>
      <div class="error-text" id="err-sdt"></div>

      <input type="email" th:field="*{email}" id="email" placeholder="Email" required>
      <div class="error-text" id="err-email"></div>

      <input type="password" th:field="*{password}" id="password" placeholder="Mật khẩu" required>
      <div class="error-text" id="err-password"></div>

      <input type="password" name="confirm" id="confirm" placeholder="Xác nhận mật khẩu" required>
      <div class="error-text" id="err-confirm"></div>

      <button type="submit">Đăng ký</button>

      <div class="register-links">
        <p>Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a></p>
      </div>
    </form>
  </div>
</div>

<script>
  // ✅ Popup animation when success
  const popup = document.getElementById("successPopup");
  if (popup) {
    popup.classList.add("show");
    setTimeout(() => popup.classList.remove("show"), 3000);
  }

  // ✅ Client-side validation
  function validateForm() {
    let valid = true;

    const fields = [
      { id: "tenKH", msg: "Vui lòng nhập họ tên!" },
      { id: "sdt", msg: "Vui lòng nhập số điện thoại!" },
      { id: "email", msg: "Vui lòng nhập email!" },
      { id: "password", msg: "Vui lòng nhập mật khẩu!" },
      { id: "confirm", msg: "Vui lòng xác nhận mật khẩu!" }
    ];

    fields.forEach(f => {
      const input = document.getElementById(f.id);
      const err = document.getElementById("err-" + f.id);
      if (!input.value.trim()) {
        input.classList.add("input-error");
        err.textContent = f.msg;
        valid = false;
      } else {
        input.classList.remove("input-error");
        err.textContent = "";
      }
    });

    const pw = document.getElementById("password").value;
    const cf = document.getElementById("confirm").value;
    if (pw && cf && pw !== cf) {
      document.getElementById("confirm").classList.add("input-error");
      document.getElementById("err-confirm").textContent = "Mật khẩu không khớp!";
      valid = false;
    }

    return valid;
  }
</script>

</body>
</html>
