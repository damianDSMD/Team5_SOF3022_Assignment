<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/}">Sản phẩm</a>
    <a th:href="@{/cart}">Giỏ hàng</a>
</nav>

<div class="container">
    <!-- Kiểm tra nếu có sản phẩm -->
    <th:block th:if="${products != null and !products.isEmpty()}">
        <!-- Lặp qua danh sách sản phẩm từ database -->
        <div class="card" th:each="product : ${products}">
            <!-- Hiển thị hình ảnh -->
            <th:block th:if="${product.hinhAnhs != null and !product.hinhAnhs.isEmpty()}">
                <img th:src="${product.hinhAnhs[0].filePath}"
                     th:alt="${product.tenSP}"
                     onerror="this.src='https://picsum.photos/400/200?grayscale&random=1'">
            </th:block>

            <!-- Placeholder nếu không có hình -->
            <th:block th:unless="${product.hinhAnhs != null and !product.hinhAnhs.isEmpty()}">
                <img src="https://picsum.photos/400/200?grayscale&random=1"
                     th:alt="${product.tenSP}">
            </th:block>

            <div class="card-body">
                <h3 th:text="${product.tenSP}">Sản phẩm A</h3>
                <p class="price">
                    <span th:text="${#numbers.formatDecimal(product.donGia, 0, 'COMMA', 0, 'POINT')}">100.000</span>đ
                </p>

                <!-- Nút Xem chi tiết -->
                <a th:href="@{/product/{id}(id=${product.maSP})}" class="btn-detail">
                    Xem chi tiết
                </a>

                <!-- Nút Thêm vào giỏ - SỬA LỖI ĐÂY -->
                <button class="btn-add-cart"
                        th:attr="data-id=${product.maSP}, data-name=${product.tenSP}"
                        onclick="addToCart(this)">
                    Thêm vào giỏ
                </button>
            </div>
        </div>
    </th:block>

    <!-- Thông báo nếu không có sản phẩm -->
    <th:block th:if="${products == null or products.isEmpty()}">
        <div class="no-products">
            <h2>Không có sản phẩm nào</h2>
            <p>Vui lòng thêm sản phẩm vào database</p>
        </div>
    </th:block>
</div>

<script>
    function addToCart(button) {
        const maSP = button.getAttribute('data-id');
        const tenSP = button.getAttribute('data-name');
        console.log('Thêm sản phẩm:', maSP, tenSP);
        alert('Đã thêm "' + tenSP + '" vào giỏ hàng!');
    }
</script>
</body>
</html>
