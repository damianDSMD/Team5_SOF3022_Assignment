# ===================================
# SERVER CONFIGURATION
# ===================================
server.port=8080

# ===================================
# DATABASE CONFIGURATION (MS SQL)
# ===================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Nhom5_Java5;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# JPA/HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=none

# Hi?n th? SQL query trong console
spring.jpa.show-sql=true

# Format SQL cho d? ??c
spring.jpa.properties.hibernate.format_sql=true

# S? d?ng SQL Server dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# QUAN TR?NG: T?t tính n?ng t? ??ng ??i tên b?ng/c?t
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ===================================
# THYMELEAF CONFIGURATION
# ===================================
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.check-template-location=true

# ===================================
# STATIC RESOURCES
# ===================================
spring.web.resources.static-locations=classpath:/static/

# ===================================
# LOGGING (Optional - ?? debug)
# ===================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG

