<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Layout chính */
    .contact-section {
      max-width: 1100px;
      margin: 80px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 40px;
      padding: 0 30px;
      animation: fadeIn 1s ease;
    }

    .contact-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      box-shadow: 0 8px 35px rgba(0,0,0,0.6);
      padding: 40px;
      transition: 0.4s ease;
    }
    .contact-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(255,255,255,0.15);
    }

    .contact-card h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      background: linear-gradient(90deg,#fff,#aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Thông tin liên hệ */
    .contact-info p {
      margin: 18px 0;
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 1rem;
      opacity: 0.9;
    }

    .contact-info svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      stroke: #fff;
      opacity: 0.8;
      transition: 0.3s;
    }

    .contact-info a {
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
    }

    .contact-info a:hover, .contact-info svg:hover {
      color: #00e0ff;
      stroke: #00e0ff;
    }

    /* Form liên hệ */
    .contact-form form {
      display: flex;
      flex-direction: column;
    }

    .contact-form input, .contact-form textarea {
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 20px;
      padding: 14px 18px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 15px;
      outline: none;
      transition: 0.3s;
    }

    .contact-form input:focus, .contact-form textarea:focus {
      background: rgba(255,255,255,0.18);
      box-shadow: 0 0 10px rgba(255,255,255,0.25);
    }

    .contact-form button {
      border: 2px solid #fff;
      background: transparent;
      color: #fff;
      font-weight: bold;
      border-radius: 25px;
      padding: 12px;
      cursor: pointer;
      transition: 0.4s;
    }

    .contact-form button:hover {
      background: #fff;
      color: #000;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    /* Bản đồ */
    .map {
      margin-top: 25px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
    }
    iframe {
      width: 100%;
      height: 250px;
      border: none;
    }

    /* Footer */
    footer {
      margin-top: 100px;
      padding: 25px 0;
      text-align: center;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      color: #ccc;
      font-size: 0.9rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    footer a {
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
    }
    footer a:hover {
      color: #00e0ff;
    }
  </style>
</head>
<body>

      <h2>Gửi tin nhắn</h2>
